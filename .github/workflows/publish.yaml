name: Publish Package

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'

permissions:
  id-token: write  # Required for npm OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: latest
          registry-url: 'https://registry.npmjs.org'

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test
      - run: bun run test:pack
      - run: npm install -g npm@latest  # ensure OIDC trusted publishing support (npm >=11.5.1)

      - name: Determine npm dist-tag
        id: dist-tag
        run: |
          version="$(node -p "require('./package.json').version")"
          prerelease="${version#*-}"
          if [ "$prerelease" = "$version" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${prerelease%%.*}" >> "$GITHUB_OUTPUT"
          fi

      - run: npm publish --access public --tag ${{ steps.dist-tag.outputs.tag }}
