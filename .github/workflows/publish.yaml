name: Publish Package

on:
  push:
    branches:
      - develop
    paths:
      - 'package.json'
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump to apply before publishing'
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: none
      dist_tag:
        description: 'npm dist-tag to publish under'
        type: choice
        options:
          - latest
          - beta
          - alpha
          - demo
        default: latest

permissions:
  id-token: write  # Required for npm OIDC trusted publishing
  contents: write  # Required to create the GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: latest
          registry-url: 'https://registry.npmjs.org'

      - name: Bump package version
        if: github.event_name == 'workflow_dispatch' && inputs.version_bump != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          npm version "${{ inputs.version_bump }}" --no-git-tag-version
          version="$(node -p "require('./package.json').version")"

          if grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            date="$(date -u +%Y-%m-%d)"
            sed -i "s/^## \[Unreleased\]/## [$version] - $date/" CHANGELOG.md
            # Insert the new version's link reference right above the previous
            # most recent one, keeping the reference-style links sorted newest first.
            sed -i "0,\|^\[[0-9].*\]: https://github.com/${{ github.repository }}/releases/tag/v|s||[$version]: https://github.com/${{ github.repository }}/releases/tag/v$version\n&|" CHANGELOG.md
          fi

          git add package.json CHANGELOG.md
          git commit -m "chore: bump version to $version"
          git push origin HEAD:${{ github.event.repository.default_branch }}

          sha="$(git rev-parse HEAD)"
          echo "Bumped version to \`$version\` in [$sha](https://github.com/${{ github.repository }}/commit/$sha)" >> "$GITHUB_STEP_SUMMARY"

      - name: Read version from package.json
        id: pkg
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Check if this version was already released
        id: check-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.pkg.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "package.json version v${{ steps.pkg.outputs.version }} already has a release, skipping publish"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check-release.outputs.exists == 'false'
        run: bun install --frozen-lockfile
      - if: steps.check-release.outputs.exists == 'false'
        run: bun run build
      - if: steps.check-release.outputs.exists == 'false'
        run: bun test

      - name: Determine npm dist-tag
        id: dist-tag
        if: steps.check-release.outputs.exists == 'false'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.dist_tag }}" >> "$GITHUB_OUTPUT"
          else
            version="${{ steps.pkg.outputs.version }}"
            prerelease="${version#*-}"
            if [ "$prerelease" = "$version" ]; then
              echo "tag=latest" >> "$GITHUB_OUTPUT"
            else
              echo "tag=${prerelease%%.*}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Publish to npm
        id: npm-publish
        if: steps.check-release.outputs.exists == 'false'
        run: npm publish --access public --tag ${{ steps.dist-tag.outputs.tag }}

      - name: Extract changelog notes for this version
        id: changelog
        if: steps.check-release.outputs.exists == 'false' && steps.npm-publish.outcome == 'success'
        run: |
          version="${{ steps.pkg.outputs.version }}"
          notes="$(awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)"
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.check-release.outputs.exists == 'false' && steps.npm-publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          version="${{ steps.pkg.outputs.version }}"
          pkg_name="${{ steps.pkg.outputs.name }}"
          notes_file="$(mktemp)"
          printf '%s\n\n[View %s@%s on npm](https://www.npmjs.com/package/%s/v/%s)\n' \
            "$NOTES" "$pkg_name" "$version" "$pkg_name" "$version" > "$notes_file"
          gh release create "v$version" \
            --repo "${{ github.repository }}" \
            --title "v$version" \
            --target "${{ github.event.repository.default_branch }}" \
            --notes-file "$notes_file"
