name: Publish Package

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'

permissions:
  id-token: write  # Required for npm OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: latest
          registry-url: 'https://registry.npmjs.org'

      - name: Set package.json version from ref name
        # tag push -> ref_name is "v1.2.3"; branch push -> "release/v1.2.3-demo.1"
        run: |
          version="${{ github.ref_name }}"
          version="${version#release/}"
          version="${version#v}"
          npm pkg set version="$version"

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test
      - run: bun run test:pack

      - name: Strip the empty authToken setup-node writes to .npmrc
        # setup-node's registry-url always writes an
        # //registry.npmjs.org/:_authToken line referencing
        # NODE_AUTH_TOKEN, even when that env var is unset. npm treats
        # that (empty) entry as configured credentials and never
        # attempts the OIDC trusted-publishing exchange, so strip it.
        run: sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"

      - name: Determine npm dist-tag
        id: dist-tag
        run: |
          version="$(node -p "require('./package.json').version")"
          prerelease="${version#*-}"
          if [ "$prerelease" = "$version" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${prerelease%%.*}" >> "$GITHUB_OUTPUT"
          fi

      - run: npm publish --access public --tag ${{ steps.dist-tag.outputs.tag }} --loglevel silly
