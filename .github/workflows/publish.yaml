name: Publish Package

on:
  push:
    branches:
      - develop
    paths:
      - 'package.json'
  workflow_dispatch: {}

permissions:
  id-token: write  # Required for npm OIDC trusted publishing
  contents: write  # Required to create the GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: latest
          registry-url: 'https://registry.npmjs.org'

      - name: Read version from package.json
        id: pkg
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Check if this version was already released
        id: check-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.pkg.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "package.json version v${{ steps.pkg.outputs.version }} already has a release, skipping publish"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check-release.outputs.exists == 'false'
        run: bun install --frozen-lockfile
      - if: steps.check-release.outputs.exists == 'false'
        run: bun run build
      - if: steps.check-release.outputs.exists == 'false'
        run: bun test
      - if: steps.check-release.outputs.exists == 'false'
        run: bun run test:pack

      - name: Determine npm dist-tag
        id: dist-tag
        if: steps.check-release.outputs.exists == 'false'
        run: |
          version="${{ steps.pkg.outputs.version }}"
          prerelease="${version#*-}"
          if [ "$prerelease" = "$version" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${prerelease%%.*}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        id: npm-publish
        if: steps.check-release.outputs.exists == 'false'
        run: npm publish --access public --tag ${{ steps.dist-tag.outputs.tag }}

      - name: Extract changelog notes for this version
        id: changelog
        if: steps.check-release.outputs.exists == 'false' && steps.npm-publish.outcome == 'success'
        run: |
          version="${{ steps.pkg.outputs.version }}"
          notes="$(awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)"
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.check-release.outputs.exists == 'false' && steps.npm-publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          version="${{ steps.pkg.outputs.version }}"
          pkg_name="${{ steps.pkg.outputs.name }}"
          notes_file="$(mktemp)"
          printf '%s\n\n[View %s@%s on npm](https://www.npmjs.com/package/%s/v/%s)\n' \
            "$NOTES" "$pkg_name" "$version" "$pkg_name" "$version" > "$notes_file"
          gh release create "v$version" \
            --repo "${{ github.repository }}" \
            --title "v$version" \
            --target "${{ github.event.repository.default_branch }}" \
            --notes-file "$notes_file"
