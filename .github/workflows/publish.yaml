name: Publish Package

on:
  push:
    branches:
      - develop
    paths:
      - 'package.json'
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump to apply before publishing'
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: none
      dist_tag:
        description: 'npm dist-tag to publish under'
        type: choice
        options:
          - latest
          - beta
          - alpha
          - demo
        default: latest

permissions:
  id-token: write  # Required for npm OIDC trusted publishing
  contents: write  # Required to create the GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: latest
          registry-url: 'https://registry.npmjs.org'

      - name: Bump package version
        if: github.event_name == 'workflow_dispatch' && inputs.version_bump != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          npm version "${{ inputs.version_bump }}" --no-git-tag-version
          version="$(node -p "require('./package.json').version")"

          if grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            date="$(date -u +%Y-%m-%d)"
            sed -i "s/^## \[Unreleased\]/## [$version] - $date/" CHANGELOG.md
            # Insert the new version's link reference right above the previous
            # most recent one, keeping the reference-style links sorted newest first.
            sed -i "0,\|^\[[0-9].*\]: https://github.com/${{ github.repository }}/releases/tag/v|s||[$version]: https://github.com/${{ github.repository }}/releases/tag/v$version\n&|" CHANGELOG.md
          fi

          git add package.json CHANGELOG.md
          git commit -m "chore: bump version to $version"
          sha="$(git rev-parse HEAD)"

          git push origin HEAD:${{ github.ref_name }}

          echo "Bumped version to \`$version\` in [$sha](https://github.com/${{ github.repository }}/commit/$sha)" >> "$GITHUB_STEP_SUMMARY"

      - name: Read version from package.json
        id: pkg
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Check if this version was already released
        id: check-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.pkg.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "package.json version v${{ steps.pkg.outputs.version }} already has a release, skipping publish"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check-release.outputs.exists == 'false'
        run: bun install --frozen-lockfile
      - if: steps.check-release.outputs.exists == 'false'
        run: bun run build
      - if: steps.check-release.outputs.exists == 'false'
        run: bun test

      # `npm stage publish` needs npm 11.15.0+; the version bundled with
      # actions/setup-node's `node-version: latest` isn't guaranteed to be
      # that recent yet.
      - if: steps.check-release.outputs.exists == 'false'
        run: npm install -g npm@latest

      - name: Determine npm dist-tag
        id: dist-tag
        if: steps.check-release.outputs.exists == 'false'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.dist_tag }}" >> "$GITHUB_OUTPUT"
          else
            version="${{ steps.pkg.outputs.version }}"
            prerelease="${version#*-}"
            if [ "$prerelease" = "$version" ]; then
              echo "tag=latest" >> "$GITHUB_OUTPUT"
            else
              echo "tag=${prerelease%%.*}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Dry-run the staged publish
        id: npm-publish-dry-run
        if: steps.check-release.outputs.exists == 'false'
        run: npm stage publish ./dist --access public --tag ${{ steps.dist-tag.outputs.tag }} --provenance --dry-run

      - name: Stage npm publish (signed provenance)
        id: npm-publish
        if: steps.check-release.outputs.exists == 'false'
        run: |
          npm stage publish ./dist --access public --tag ${{ steps.dist-tag.outputs.tag }} --provenance --json | tee stage-result.json
          stage_id="$(node -p "(() => { const r = require('./stage-result.json'); return r.id ?? r.stageId ?? r.stage_id ?? ''; })()")"
          staged_url="https://www.npmjs.com/settings/${NPM_OWNER}/staged-packages/?page=0&perPage=10&filterPackage=${{ steps.pkg.outputs.name }}"
          echo "stage_id=$stage_id" >> "$GITHUB_OUTPUT"
          echo "staged_url=$staged_url" >> "$GITHUB_OUTPUT"
          {
            echo "### npm package staged, awaiting approval"
            echo ""
            echo "\`${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}\` is staged under tag \`${{ steps.dist-tag.outputs.tag }}\` but not yet live."
            echo "A maintainer with publish access must approve it (2FA required) before it's installable:"
            echo ""
            echo "- Review and approve it on npm: $staged_url"
            echo "- Or from the CLI: \`npm stage approve $stage_id\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          NPM_OWNER: jondotsoy

      - name: Extract changelog notes for this version
        id: changelog
        if: steps.check-release.outputs.exists == 'false' && steps.npm-publish.outcome == 'success'
        run: |
          version="${{ steps.pkg.outputs.version }}"
          notes="$(awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)"
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.check-release.outputs.exists == 'false' && steps.npm-publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          version="${{ steps.pkg.outputs.version }}"
          pkg_name="${{ steps.pkg.outputs.name }}"
          notes_file="$(mktemp)"
          printf '%s\n\n%s@%s is staged (id `%s`) and pending a maintainer'"'"'s approval before it goes live at https://www.npmjs.com/package/%s/v/%s\n\nApprove it at %s\n' \
            "$NOTES" "$pkg_name" "$version" "${{ steps.npm-publish.outputs.stage_id }}" "$pkg_name" "$version" "${{ steps.npm-publish.outputs.staged_url }}" > "$notes_file"
          release_url="$(gh release create "v$version" \
            --repo "${{ github.repository }}" \
            --title "v$version" \
            --target "${{ github.ref_name }}" \
            --notes-file "$notes_file")"

          echo "Created release [v$version]($release_url)" >> "$GITHUB_STEP_SUMMARY"
