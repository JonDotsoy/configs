name: PR Test Plan

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  test-plan:
    # Skip draft PRs — the test plan only runs once a PR is marked ready for review.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: bun test
        id: bun_test
        continue-on-error: true
        run: |
          set -o pipefail
          bun test 2>&1 | tee bun-test-output.txt

      - name: Summarize bun test coverage
        id: bun_test_summary
        run: |
          pass=$(grep -oE '^[[:space:]]*[0-9]+ pass' bun-test-output.txt | grep -oE '[0-9]+' || echo 0)
          fail=$(grep -oE '^[[:space:]]*[0-9]+ fail' bun-test-output.txt | grep -oE '[0-9]+' || echo 0)
          total=$((pass + fail))
          echo "pass=$pass" >> "$GITHUB_OUTPUT"
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"

      # test/cases/*.ts imports the package by its own name (e.g. "hotconfigs"),
      # resolved via package.json's self-reference — which only works once dist/ exists.
      - run: bun run build

      - name: bunx tsc --noEmit -p tsconfig.json
        id: tsc
        continue-on-error: true
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: bun run test:browser
        id: test_browser
        continue-on-error: true
        run: |
          set -o pipefail
          bun run test:browser 2>&1 | tee test-browser-output.txt

      - name: Summarize test:browser coverage
        id: test_browser_summary
        run: |
          passed=$(grep -oE '[0-9]+ passed' test-browser-output.txt | grep -oE '^[0-9]+' || echo 0)
          failed=$(grep -oE '[0-9]+ failed' test-browser-output.txt | grep -oE '^[0-9]+' || echo 0)
          total=$((passed + failed))
          echo "passed=${passed:-0}" >> "$GITHUB_OUTPUT"
          echo "total=${total:-0}" >> "$GITHUB_OUTPUT"

      - name: bun run smoke
        id: smoke
        continue-on-error: true
        run: bun run smoke

      - name: Write job summary
        if: always()
        run: |
          {
            echo "### Test plan results"
            echo
            echo "| Check | Result | Coverage |"
            echo "| --- | --- | --- |"
            echo "| \`bun test\` | ${{ steps.bun_test.outcome == 'success' && '✅' || '❌' }} | ${{ steps.bun_test_summary.outputs.pass }}/${{ steps.bun_test_summary.outputs.total }} tests passed |"
            echo "| \`bunx tsc --noEmit -p tsconfig.json\` | ${{ steps.tsc.outcome == 'success' && '✅' || '❌' }} | — |"
            echo "| \`bun run test:browser\` | ${{ steps.test_browser.outcome == 'success' && '✅' || '❌' }} | ${{ steps.test_browser_summary.outputs.passed }}/${{ steps.test_browser_summary.outputs.total }} tests passed |"
            echo "| \`bun run smoke\` | ${{ steps.smoke.outcome == 'success' && '✅' || '❌' }} | — |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Reflects each step's real outcome — and bun test's pass/total
      # coverage — back onto the PR body's Test plan checklist, so the
      # description always matches what CI actually ran.
      - name: Update test plan checklist in PR description
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              "`bun test`": {
                outcome: "${{ steps.bun_test.outcome }}",
                coverage: "${{ steps.bun_test_summary.outputs.pass }}/${{ steps.bun_test_summary.outputs.total }} tests passed",
              },
              "`bunx tsc --noEmit -p tsconfig.json`": {
                outcome: "${{ steps.tsc.outcome }}",
              },
              "`bun run test:browser`": {
                outcome: "${{ steps.test_browser.outcome }}",
                coverage: "${{ steps.test_browser_summary.outputs.passed }}/${{ steps.test_browser_summary.outputs.total }} tests passed",
              },
              "`bun run smoke`": {
                outcome: "${{ steps.smoke.outcome }}",
              },
            };

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            let body = pr.body ?? "";
            for (const [command, { outcome, coverage }] of Object.entries(results)) {
              const box = outcome === "success" ? "[x]" : "[ ]";
              const suffix = coverage ? ` — ${coverage}` : "";
              // Drop any coverage suffix a previous run left behind before re-adding the current one.
              const pattern = new RegExp(`- \\[[ x]\\] ${command}(?: — .*)?$`, "gm");
              body = body.replace(pattern, `- ${box} ${command}${suffix}`);
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body,
            });

      - name: Fail if any test plan step failed
        if: |
          steps.bun_test.outcome == 'failure' ||
          steps.tsc.outcome == 'failure' ||
          steps.test_browser.outcome == 'failure' ||
          steps.smoke.outcome == 'failure'
        run: exit 1
