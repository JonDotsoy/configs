name: PR Test Plan

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  test-plan:
    # Skip draft PRs — the test plan only runs once a PR is marked ready for review.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: bun test
        id: bun_test
        continue-on-error: true
        run: |
          set -o pipefail
          bun test 2>&1 | tee bun-test-output.txt

      - name: Summarize bun test coverage
        id: bun_test_summary
        run: |
          pass=$(grep -oE '^[[:space:]]*[0-9]+ pass' bun-test-output.txt | grep -oE '[0-9]+' || echo 0)
          fail=$(grep -oE '^[[:space:]]*[0-9]+ fail' bun-test-output.txt | grep -oE '[0-9]+' || echo 0)
          total=$((pass + fail))
          echo "pass=$pass" >> "$GITHUB_OUTPUT"
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"

      # test/cases/*.ts imports the package by its own name (e.g. "hotconfigs"),
      # resolved via package.json's self-reference — which only works once dist/ exists.
      - run: bun run build

      - name: bunx tsc --noEmit -p tsconfig.json
        id: tsc
        continue-on-error: true
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: bun run test:browser
        id: test_browser
        continue-on-error: true
        run: |
          set -o pipefail
          bun run test:browser 2>&1 | tee test-browser-output.txt

      - name: Summarize test:browser coverage
        id: test_browser_summary
        run: |
          passed=$(grep -oE '[0-9]+ passed' test-browser-output.txt | grep -oE '^[0-9]+' || echo 0)
          failed=$(grep -oE '[0-9]+ failed' test-browser-output.txt | grep -oE '^[0-9]+' || echo 0)
          total=$((passed + failed))
          echo "passed=${passed:-0}" >> "$GITHUB_OUTPUT"
          echo "total=${total:-0}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: denoland/setup-deno@v2
        with:
          deno-version: latest

      - name: Record CLI binaries for test:cases
        run: |
          echo "NODE_BIN=$(which node)" >> "$GITHUB_ENV"
          echo "BUN_BIN=$(which bun)" >> "$GITHUB_ENV"
          echo "DENO_BIN=$(which deno)" >> "$GITHUB_ENV"

      - name: bun run test:cases
        id: test_cases
        continue-on-error: true
        run: |
          set -o pipefail
          bun run test:cases 2>&1 | tee test-cases-output.txt

      - name: Summarize test:cases coverage
        id: test_cases_summary
        run: |
          # Matched on the "<n> case runs: ..." keyword line, not anchored to the full
          # trailing text — so it keeps working if the wording after each count changes.
          line=$(grep -E '^[0-9]+ case runs:' test-cases-output.txt || echo "0 case runs: 0 passed, 0 failed, 0 warned, 0 skipped.")
          total=$(echo "$line" | grep -oE '^[0-9]+')
          passed=$(echo "$line" | grep -oE '[0-9]+ passed' | grep -oE '^[0-9]+')
          warned=$(echo "$line" | grep -oE '[0-9]+ warned' | grep -oE '^[0-9]+')
          skipped=$(echo "$line" | grep -oE '[0-9]+ skipped' | grep -oE '^[0-9]+')
          echo "passed=${passed:-0}" >> "$GITHUB_OUTPUT"
          echo "warned=${warned:-0}" >> "$GITHUB_OUTPUT"
          echo "skipped=${skipped:-0}" >> "$GITHUB_OUTPUT"
          echo "total=${total:-0}" >> "$GITHUB_OUTPUT"

      - name: Upload test cases report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-cases-report
          path: test-cases-report/report.md

      # Posts (or updates, on a later push) a single PR comment summarizing test-cases-report/report.md
      # as a case x engine matrix — the full report is too large for a PR comment (GitHub's 65536-char
      # limit), so this links to it (at this commit, and as this run's build artifact) instead.
      - name: Post/update test cases report comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const reportPath = "test-cases-report/report.md";
            if (!fs.existsSync(reportPath)) return;

            const content = fs.readFileSync(reportPath, "utf8");
            const sections = content.split(/^## case /m).slice(1);
            const rows = [];
            for (const section of sections) {
              const [header, ...rest] = section.split("\n");
              const match = header.match(/^test\/cases\/(\S+) — (\w+)/);
              if (!match) continue;
              const [, file, engine] = match;
              const body = rest.join("\n");
              const statusMatch = body.match(/```\n\[(.*?)\]/);
              rows.push({ file, engine, status: statusMatch ? statusMatch[1] : "?" });
            }
            if (rows.length === 0) return;

            const icon = (status) => {
              if (status.startsWith("PASSED")) return "✅";
              if (status.startsWith("WARNING")) return "⚠️";
              if (status.startsWith("SKIPPED")) return "⏭️";
              if (status.startsWith("FAILED")) return "❌";
              return "❔";
            };

            const files = [...new Set(rows.map((r) => r.file))];
            const engines = ["node", "bun", "deno", "browser"];
            const cellFor = new Map(rows.map((r) => [`${r.file}|${r.engine}`, icon(r.status)]));

            let table = "| case | node | bun | deno | browser |\n| --- | --- | --- | --- | --- |\n";
            for (const file of files) {
              const cells = engines.map((engine) => cellFor.get(`${file}|${engine}`) ?? "—");
              table += `| \`${file}\` | ${cells.join(" | ")} |\n`;
            }

            const passed = rows.filter((r) => r.status.startsWith("PASSED")).length;
            const warned = rows.filter((r) => r.status.startsWith("WARNING"));
            const failed = rows.filter((r) => r.status.startsWith("FAILED")).length;
            const skipped = rows.filter((r) => r.status.startsWith("SKIPPED")).length;

            // context.sha is the ephemeral merge commit `pull_request` events run against, not the
            // PR branch's real tip — link against the actual head sha instead so it resolves.
            const headSha = context.payload.pull_request.head.sha;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const blobUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${headSha}/test-cases-report/report.md`;
            const shortSha = headSha.slice(0, 7);

            let warnedSection = "";
            if (warned.length > 0) {
              warnedSection =
                "\n⚠️ = a tolerated failure (`tolerateFailureEngines` in `test/cases/manifest.ts`) — it still runs, but doesn't fail the job:\n\n" +
                warned.map((w) => `- \`${w.file}\` (${w.engine})`).join("\n") +
                "\n";
            }

            const counts = [`${passed}/${rows.length} passed`];
            if (failed > 0) counts.push(`${failed} failed`);
            if (warned.length > 0) counts.push(`${warned.length} warned`);
            if (skipped > 0) counts.push(`${skipped} skipped`);

            const marker = "<!-- test-cases-report-comment -->";
            const body =
              `${marker}\n` +
              `## \`test:cases\` report\n\n` +
              `From [this run](${runUrl}) (commit \`${shortSha}\`): **${counts.join(", ")}**.\n\n` +
              `${table}${warnedSection}\n` +
              `Full report: [test-cases-report/report.md](${blobUrl}) at this commit, or download the \`test-cases-report\` artifact from [this run](${runUrl}).`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Write job summary
        if: always()
        run: |
          {
            echo "### Test plan results"
            echo
            echo "| Check | Result | Coverage |"
            echo "| --- | --- | --- |"
            echo "| \`bun test\` | ${{ steps.bun_test.outcome == 'success' && '✅' || '❌' }} | ${{ steps.bun_test_summary.outputs.pass }}/${{ steps.bun_test_summary.outputs.total }} tests passed |"
            echo "| \`bunx tsc --noEmit -p tsconfig.json\` | ${{ steps.tsc.outcome == 'success' && '✅' || '❌' }} | — |"
            echo "| \`bun run test:browser\` | ${{ steps.test_browser.outcome == 'success' && '✅' || '❌' }} | ${{ steps.test_browser_summary.outputs.passed }}/${{ steps.test_browser_summary.outputs.total }} tests passed |"
            echo "| \`bun run test:cases\` | ${{ steps.test_cases.outcome == 'success' && '✅' || '❌' }} | ${{ steps.test_cases_summary.outputs.passed }}/${{ steps.test_cases_summary.outputs.total }} case runs passed (${{ steps.test_cases_summary.outputs.warned }} warned, ${{ steps.test_cases_summary.outputs.skipped }} skipped) |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Reflects each step's real outcome — and bun test's pass/total
      # coverage — back onto the PR body's Test plan checklist, so the
      # description always matches what CI actually ran.
      - name: Update test plan checklist in PR description
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              "`bun test`": {
                outcome: "${{ steps.bun_test.outcome }}",
                coverage: "${{ steps.bun_test_summary.outputs.pass }}/${{ steps.bun_test_summary.outputs.total }} tests passed",
              },
              "`bunx tsc --noEmit -p tsconfig.json`": {
                outcome: "${{ steps.tsc.outcome }}",
              },
              "`bun run test:browser`": {
                outcome: "${{ steps.test_browser.outcome }}",
                coverage: "${{ steps.test_browser_summary.outputs.passed }}/${{ steps.test_browser_summary.outputs.total }} tests passed",
              },
              "`bun run test:cases`": {
                outcome: "${{ steps.test_cases.outcome }}",
                coverage: "${{ steps.test_cases_summary.outputs.passed }}/${{ steps.test_cases_summary.outputs.total }} case runs passed (${{ steps.test_cases_summary.outputs.warned }} warned, ${{ steps.test_cases_summary.outputs.skipped }} skipped)",
              },
            };

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            let body = pr.body ?? "";
            for (const [command, { outcome, coverage }] of Object.entries(results)) {
              const box = outcome === "success" ? "[x]" : "[ ]";
              const suffix = coverage ? ` — ${coverage}` : "";
              // Drop any coverage suffix a previous run left behind before re-adding the current one.
              const pattern = new RegExp(`- \\[[ x]\\] ${command}(?: — .*)?$`, "gm");
              body = body.replace(pattern, `- ${box} ${command}${suffix}`);
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body,
            });

      - name: Fail if any test plan step failed
        if: |
          steps.bun_test.outcome == 'failure' ||
          steps.tsc.outcome == 'failure' ||
          steps.test_browser.outcome == 'failure' ||
          steps.test_cases.outcome == 'failure'
        run: exit 1
